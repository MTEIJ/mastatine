services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mastatine
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: mastatine
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mastatine -d mastatine"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  app:
    # Built and published by GitHub Actions (.github/workflows/ci.yml). `docker compose up -d --build` still builds locally.
    image: ${MASTATINE_IMAGE:-ghcr.io/mteij/mastatine:latest}
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://mastatine:${POSTGRES_PASSWORD}@db:5432/mastatine
      SITE_URL: ${SITE_URL:?set SITE_URL in .env (public https origin, no trailing slash)}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env (openssl rand -base64 32)}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # Finance app: optional fixed bootstrap list. Admins normally grant roles under Admin -> Finance access.
      FINANCE_TREASURER_EMAILS: ${FINANCE_TREASURER_EMAILS:-}
      FINANCE_AUDITOR_EMAILS: ${FINANCE_AUDITOR_EMAILS:-}
      SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST in .env}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:?set SMTP_USER in .env}
      SMTP_PASS: ${SMTP_PASS:?set SMTP_PASS in .env}
      MAIL_FROM: ${MAIL_FROM:?set MAIL_FROM in .env}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
      LEGAL_NAME: ${LEGAL_NAME:-}
      LEGAL_ADDRESS: ${LEGAL_ADDRESS:-}
      KVK_NUMBER: ${KVK_NUMBER:-}
      SHOP_URL: ${SHOP_URL:-}
      # Merch page: the shop id switches on the live product feed; the API key (optional) adds colour names and codes.
      SPREADSHIRT_SHOP_ID: ${SPREADSHIRT_SHOP_ID:-}
      SPREADSHIRT_API_KEY: ${SPREADSHIRT_API_KEY:-}
      # Web push notifications (optional: without the keys the notification switch is hidden). Generate once: bunx web-push generate-vapid-keys
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
    volumes:
      - uploads:/data/uploads
      - finance:/data/finance
      - documents:/data/documents
      - imgcache:/app/.next/cache
    # Loopback only: point your existing reverse proxy at 127.0.0.1:3000.
    ports:
      - "127.0.0.1:3000:3000"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  pgdata:
  uploads:
  finance:
  documents:
  imgcache:
